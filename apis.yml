aid: shipwire
name: Shipwire
description: Shipwire is a global fulfillment and third-party logistics (3PL) platform
  providing a REST API for managing orders, inventory, warehousing, shipments, returns,
  and carrier selection across a worldwide network of fulfillment centers. The platform
  serves eCommerce brands with nine distinct RESTful APIs covering order management,
  stock tracking, receiving, returns, rate shopping, product catalogs, purchase orders,
  webhooks, and address validation, enabling fully automated fulfillment workflows.
